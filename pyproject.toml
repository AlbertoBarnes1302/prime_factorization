[project]
name = "prime-factorization"
version = "0.1.1"
description = "Factors integers up to around 10**18 using trial division, Pollard's rho, and Miller-Rabin primality testing."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
